<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>정동401프로젝트</title>
<style>
  :root {
    --hfk-red: #980000;
    --hfk-burgundy: #441a15;
    --hfk-charcoal: #2d2523;
    --hfk-cream: #f0eae2;
    --hfk-cream-light: #e1dac9;
    --hfk-line: #ddcfbf;
    --text: var(--hfk-charcoal);
    --muted: #6b5f5b;
    --bg: var(--hfk-cream);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    font-size: 15.5px; line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--hfk-red); text-decoration: none; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 64px 20px 96px; }

  header { margin-bottom: 40px; }
  .kicker {
    font-size: 12.5px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--hfk-red); font-weight: 600; margin-bottom: 12px;
  }
  h1 {
    margin: 0 0 16px; font-size: 32px; font-weight: 700;
    color: var(--hfk-charcoal); letter-spacing: -0.02em;
  }
  .lede { font-size: 15.5px; line-height: 1.75; color: var(--text); }
  .lede p { margin: 0 0 12px; }

  h2 { font-size: 18px; font-weight: 700; margin: 48px 0 16px; color: var(--hfk-charcoal); }

  .cohorts { display: flex; flex-direction: column; gap: 10px; }
  .cohort {
    display: flex; justify-content: space-between; align-items: center;
    padding: 20px 22px; border: 1px solid var(--hfk-line); border-radius: 12px;
    transition: background .15s;
  }
  .cohort:hover { background: var(--hfk-cream-light); }
  .cohort .info .name { font-size: 16px; font-weight: 700; color: var(--hfk-charcoal); margin-bottom: 4px; }
  .cohort .info .meta { font-size: 13px; color: var(--muted); }
  .cohort .status {
    font-size: 12px; font-weight: 600; padding: 3px 12px;
    border-radius: 999px; border: 1px solid var(--hfk-line); color: var(--hfk-red);
  }
  .cohort.upcoming { opacity: .55; pointer-events: none; }
  .cohort.upcoming .status { color: var(--muted); }

  footer { margin-top: 56px; padding-top: 20px; border-top: 1px solid var(--hfk-line); font-size: 12.5px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="kicker">HFK</div>
  <h1>정동401프로젝트</h1>
  <div class="lede">
    <p>HFK 멤버들만 참여할 수 있는 PBL(Project-based Learning) 프로그램입니다. 다양한 경험을 직접 기획하고 실행하면서 자신이 무엇을 좋아하고 잘하는지 스스로 발견해 나갑니다.</p>
    <p>정동401은 오아시스가 자리한 정동 401호에서 이름을 얻었습니다. 기수마다 4~15명의 멤버가 1년 동안 함께 오프라인 활동을 만들어 갑니다.</p>
  </div>
</header>

<h2>기수 아카이브</h2>
<div class="cohorts">
  <a class="cohort" href="6기/">
    <div class="info">
      <div class="name">6기</div>
      <div class="meta">2026년 9월 ~ 2027년 8월 · 4명 · 계절 PM 방식</div>
    </div>
    <div class="status">진행 중</div>
  </a>
</div>

<footer>
  운영 HFK · 김재윤 · 마지막 업데이트 2026-09-21
</footer>

</div>
</body>
</html>
